<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Book checkout | Só Coaching</title>
  <link rel="stylesheet" href="checkout.css">
  <script defer src="https://js.stripe.com/clover/stripe.js"></script>
  <script defer src="checkout.js"></script>
</head>
<body>
  <header class="mast">
    <img src="../homepage/assets/logos/socoaching-header.webp" alt="Só Coaching, Joe McHugh" width="158" height="64">
    <span>Test checkout</span>
  </header>
  <main>
    <a class="back" href="index.html#order">Back to the book</a>
    <div class="spread">
      <section class="order" aria-labelledby="book-title">
        <div class="product">
          <img class="cover" src="../about/assets/beidh-tu-alright.jpg" alt="Green and gold cover of Beidh Tú Alright">
          <div>
            <h1 id="book-title" lang="ga">Beidh Tú Alright</h1>
            <p class="subtitle">An Irish Language Journey</p>
            <p class="edition">Joe McHugh · Signed paperback</p>
          </div>
        </div>
        <div class="copies"><label for="quantity">Quantity</label>
          <select id="quantity"><option value="1">1 copy</option><option value="2">2 copies</option></select>
        </div>
        <dl class="summary" aria-live="polite" aria-atomic="true">
          <div><dt>Books</dt><dd id="subtotal">€20.00</dd></div>
          <div><dt>Postage</dt><dd id="postage">—</dd></div>
          <div class="total"><dt>Total <small>EUR</small></dt><dd id="total">—</dd></div>
        </dl>
        <p class="note">One postage charge covers up to two copies.</p>
      </section>
      <div class="form-area">
        <p id="checkout-status" role="status" tabindex="-1">Opening secure checkout…</p>
        <noscript>Enable JavaScript to use the secure payment form.</noscript>
        <section id="delivery" hidden>
          <h2>Delivery address</h2>
          <p class="intro">Where should Joe send your signed copy?</p>
          <form id="address">
            <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="shipping name" required></div>
            <div class="field"><label for="country">Delivery country</label><select id="country" name="country" autocomplete="shipping country" required></select></div>
            <div class="field"><label for="line1">House number or name and street</label><input id="line1" name="line1" autocomplete="shipping address-line1" required></div>
            <div class="field"><label for="line2">Apartment, building or townland <small>(optional)</small></label><input id="line2" name="line2" autocomplete="shipping address-line2"></div>
            <div class="field-pair">
              <div class="field"><label for="city">Town or city</label><input id="city" name="city" autocomplete="shipping address-level2"></div>
              <div class="field"><label for="state">County or region</label><input id="state" name="state" autocomplete="shipping address-level1"></div>
            </div>
            <div class="field"><label for="postal_code">Postal code</label><input id="postal_code" name="postal_code" autocomplete="shipping postal-code"></div>
            <button id="continue" type="submit">Continue to payment</button>
          </form>
        </section>
        <section id="payment" hidden>
          <h2>Payment</h2>
          <p id="shipping-summary"></p>
          <button type="button" id="edit" class="secondary">Edit address or quantity</button>
          <div id="checkout"></div>
        </section>
        <button id="retry" type="button" hidden>Try again</button>
      </div>
    </div>
  </main>
</body>
</html>
