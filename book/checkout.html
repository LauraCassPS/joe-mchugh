<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Book checkout | Só Coaching</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3eee2; color: #233e43; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 58rem; margin: auto; padding: 1.5rem clamp(1rem, 4vw, 3rem); }
    h1 { font: 2rem/1.15 Georgia, serif; margin: 1.5rem 0 .5rem; }
    a { color: inherit; }
    button { padding: .75rem 1.5rem; font: inherit; cursor: pointer; }
    #delivery { max-width: 34rem; }
    .summary { font-size: 1.15rem; font-weight: 600; }
    select { padding: .55rem; font: inherit; }
    button { background: #294b51; color: white; border: 0; border-radius: .25rem; }
    button:disabled { opacity: .65; }
    h2 { font-size: 1.25rem; }
    :focus-visible { outline: 3px solid #295e77; outline-offset: 3px; }
  </style>
  <script defer src="https://js.stripe.com/clover/stripe.js"></script>
  <script defer src="checkout.js"></script>
</head>
<body>
  <main>
    <a href="index.html#order">Back to the book</a>
    <h1>Beidh Tú Alright</h1>
    <p>Test checkout · €20 per signed copy. Postage is charged once for one or two copies.</p>
    <p id="checkout-status" role="status" tabindex="-1">Opening secure checkout…</p>
    <noscript>Enable JavaScript to use the secure payment form.</noscript>
    <section id="delivery" hidden>
      <label for="quantity">Signed copies</label>
      <select id="quantity"><option value="1">1</option><option value="2">2</option></select>
      <h2>Delivery address</h2>
      <div id="address"></div>
      <p class="summary" id="total" aria-live="polite"></p>
      <button id="continue" type="button">Continue to payment</button>
    </section>
    <section id="payment" hidden>
      <button type="button" id="edit">Edit delivery address or quantity</button>
      <p id="shipping-summary"></p>
      <div id="checkout"></div>
    </section>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
</body>
</html>
