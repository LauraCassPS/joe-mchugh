<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <!-- Missing URLs can be nested. GitHub Pages serves this site under a project path. -->
  <base href="https://lauracassps.github.io/joe-mchugh/">
  <script>
    if (location.protocol === 'file:') {
      document.querySelector('base').href = new URL('./', location.href).href;
    } else if (location.hostname !== 'lauracassps.github.io') {
      document.querySelector('base').href = location.origin + '/';
    }
  </script>
  <title>Page not found | Só Coaching</title>
  <link rel="icon" href="homepage/assets/logos/favicon.ico">
  <link rel="stylesheet" href="shared/header.css">
  <style>
    @font-face {
      font-family: Old;
      src: url("homepage/assets/fonts/old-standard-tt-latin.woff2");
    }
    @font-face {
      font-family: Old;
      font-style: italic;
      src: url("homepage/assets/fonts/old-standard-tt-italic-latin.woff2");
    }
    @font-face {
      font-family: Libre;
      src: url("homepage/assets/fonts/libre-baskerville-400-latin.woff2");
    }
    @font-face {
      font-family: Source;
      font-weight: 200 900;
      src: url("homepage/assets/fonts/source-sans-3-latin.woff2");
    }
    :root {
      --paper: #f3eee2;
      --ink: #30312c;
      --blue: #345961;
      --rule: #8e9183;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 0 clamp(20px, 6vw, 96px) 40px;
      background-image: linear-gradient(#f3eee2ed, #f3eee2ed), url("assets/photographic-paper.png");
      font: 1rem/1.75 Libre, Georgia, serif;
    }
    .sheet { max-width: 1200px; margin: auto; }
    .masthead { border-bottom: 3px double var(--blue); padding-block: 8px; }
    .masthead .name { display: block; }
    main {
      display: grid;
      grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr);
      gap: clamp(32px, 6vw, 90px);
      align-items: center;
      padding-block: 24px clamp(40px, 6vw, 90px);
      border-bottom: 1px solid var(--rule);
    }
    h1 {
      margin: 0;
      color: var(--blue);
      font: 400 clamp(3rem, 6.3vw, 5.75rem)/1 Old, Georgia, serif;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    p { max-width: 37ch; margin: 22px 0 26px; }
    a { color: var(--blue); text-underline-offset: .22em; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .home {
      display: inline-block;
      padding: 12px 22px;
      background: var(--blue);
      color: var(--paper);
      font: 600 1rem/1.4 Source, Arial, sans-serif;
      text-decoration: none;
    }
    .home:hover { background: var(--ink); }
    nav { display: flex; flex-wrap: wrap; gap: 0 20px; margin-top: 12px; }
    nav a { padding-block: 8px; font: 1rem/1.5 Source, Arial, sans-serif; }
    nav a:hover { text-decoration-thickness: 2px; }
    figure { margin: 0; }
    figure img { width: 100%; height: auto; display: block; }
    figcaption { margin-top: 10px; text-align: right; font: italic 1.25rem/1.3 Old, Georgia, serif; }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; gap: 24px; padding-block: 16px 32px; }
      .masthead .header-logo { width: min(240px, 100%); }
      p { margin: 14px 0 20px; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="masthead">
      <a class="name" href="./" aria-label="Só Coaching homepage">
        <img class="header-logo" src="homepage/assets/logos/socoaching-header.webp" width="750" height="223" alt="Só Coaching — Joe McHugh">
      </a>
    </header>
    <main>
      <div>
        <h1>Page not found</h1>
        <p>We couldn’t find the page you were looking for. Where would you like to go?</p>
        <a class="home" href="./">Só Coaching homepage</a>
        <nav aria-label="Other pages">
          <a href="one-to-one/index.html">One-to-One Coaching</a>
          <a href="team-coaching/index.html">Team Coaching</a>
          <a href="book/index.html">The Book</a>
        </nav>
      </div>
      <figure>
        <img src="team-coaching/assets/binoculars-1200.webp" srcset="team-coaching/assets/binoculars-480.webp 480w, team-coaching/assets/binoculars-800.webp 800w, team-coaching/assets/binoculars-1200.webp 1200w" sizes="(max-width: 720px) 90vw, (max-width: 1400px) 48vw, 660px" width="1200" height="909" alt="A group looking upwards through binoculars.">
        <figcaption>Still no sign.</figcaption>
      </figure>
    </main>
  </div>
</body>
</html>
